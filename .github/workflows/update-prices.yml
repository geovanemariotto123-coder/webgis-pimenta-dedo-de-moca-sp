name: Atualizar preços da pimenta

on:
  schedule:
    - cron: "30 18 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar leitura dos boletins
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Consultar CEAGESP e CEASA Campinas
        run: python3 scripts/update_prices.py

      - name: Publicar preços atualizados
        run: |
          if git diff --quiet -- prices.json; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Atualiza cotações automáticas da pimenta"
          git push
